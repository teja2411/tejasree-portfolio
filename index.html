<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tejasree Gaddam | Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            color: black;
        }

        /* NAVIGATION */

        header {
            width: 100%;
            padding: 25px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eeeeee;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 28px;
        }

        nav a {
            color: black;
            text-decoration: none;
            font-size: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }


        /* HOME SECTION */

        .home {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            gap: 100px;
            padding: 70px 10%;
        }


        /* PHOTO */

        .photo-box {
            width: 350px;
            height: 430px;
            border: 1px solid #dddddd;

            display: flex;
            justify-content: center;
            align-items: center;

            flex-shrink: 0;
        }

        .photo-box span {
            color: #777777;
            font-size: 18px;
        }


        /* INTRODUCTION */

        .intro {
            max-width: 650px;
        }

        .hello {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .intro h1 {
            font-size: 58px;
            line-height: 1.1;
            margin-bottom: 15px;
        }

        .intro h2 {
            font-size: 28px;
            font-weight: normal;
            margin-bottom: 25px;
        }

        .description {
            font-size: 18px;
            line-height: 1.7;
            color: #444444;
            max-width: 600px;
            margin-bottom: 30px;
        }


        /* BUTTONS */

        .buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .button {
            padding: 13px 24px;
            background: black;
            color: white;
            text-decoration: none;
            border: 1px solid black;
        }

        .button-outline {
            padding: 13px 24px;
            background: white;
            color: black;
            text-decoration: none;
            border: 1px solid black;
        }

        .button:hover,
        .button-outline:hover {
            opacity: 0.7;
        }


        /* SOCIAL LINKS */

        .social-links {
            display: flex;
            gap: 25px;
        }

        .social-links a {
            color: black;
            text-decoration: none;
        }

        .social-links a:hover {
            text-decoration: underline;
        }


        /* MOBILE */

        @media (max-width: 900px) {

            header {
                padding: 20px 5%;
            }

            nav {
                gap: 15px;
            }

            .home {
                flex-direction: column;
                align-items: flex-start;
                padding: 60px 7%;
                gap: 50px;
            }

            .photo-box {
                width: 300px;
                height: 350px;
            }

            .intro h1 {
                font-size: 45px;
            }
        }


        @media (max-width: 650px) {

            header {
                flex-direction: column;
                gap: 20px;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .home {
                padding: 50px 6%;
            }

            .photo-box {
                width: 100%;
                height: 350px;
            }

            .intro h1 {
                font-size: 38px;
            }

            .buttons {
                flex-direction: column;
                align-items: flex-start;
            }
        }

    </style>
</head>


<body>


    <!-- NAVIGATION -->

    <header>

        <div class="logo">
            TG
        </div>

        <nav>

            <a href="#home">Home</a>

            <a href="#about">About</a>

            <a href="#skills">Skills</a>

            <a href="#projects">Projects</a>

            <a href="#education">Education</a>

            <a href="#experience">Experience</a>

            <a href="#contact">Contact</a>

        </nav>

    </header>



    <!-- HOME -->

    <section class="home" id="home">


        <!-- PHOTO -->

        <div class="photo-box">

            <span>
                YOUR PHOTO
            </span>

        </div>



        <!-- INTRODUCTION -->

        <div class="intro">

            <p class="hello">
                Hello, I'm
            </p>


            <h1>
                TEJASREE GADDAM
            </h1>


            <h2>
                Python Developer
            </h2>


            <p class="description">

                I build scalable, reliable applications
                using Python, modern backend technologies,
                cloud platforms, and AI.

            </p>


            <!-- BUTTONS -->

            <div class="buttons">

                <a href="#projects" class="button">
                    View My Projects
                </a>


                <a href="resume.pdf" class="button-outline">
                    Download Resume
                </a>

            </div>


            <!-- SOCIAL LINKS -->

            <div class="social-links">

                <a href="https://github.com/teja2411" target="_blank">
                    GitHub
                </a>


                <a href="https://www.linkedin.com/in/tejasree-g-8381b1226" target="_blank">
                    LinkedIn
                </a>


                <a href="mailto:tsreeusa2411@gmail.com">
                    Email
                </a>

            </div>

        </div>

    </section>


</body>

</html>
