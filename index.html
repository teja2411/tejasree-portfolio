<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tejasree Gaddam</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: white;
            color: black;
        }

        /* TOP NAVIGATION */

        header {
            width: 100%;
            padding: 25px 60px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: white;
            border-bottom: 1px solid #eeeeee;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: black;
            text-decoration: none;
            font-size: 16px;
        }

        /* HOME */

        .home {
            width: 100%;
            min-height: 85vh;

            display: flex;
            align-items: center;

            padding: 80px 10%;
            gap: 100px;
        }

        /* PHOTO */

        .photo {
            width: 350px;
            height: 430px;

            border: 1px solid #cccccc;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;
        }

        .photo p {
            color: #777777;
            font-size: 18px;
        }

        /* TEXT */

        .content {
            max-width: 650px;
        }

        .content .hello {
            font-size: 20px;
            margin-bottom: 12px;
        }

        .content h1 {
            font-size: 58px;
            line-height: 1.1;
            margin-bottom: 15px;
        }

        .content h2 {
            font-size: 28px;
            font-weight: normal;
            margin-bottom: 25px;
        }

        .description {
            font-size: 18px;
            line-height: 1.7;
            color: #444444;
            margin-bottom: 30px;
        }

        /* BUTTONS */

        .buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .buttons a {
            padding: 13px 24px;
            text-decoration: none;
            border: 1px solid black;
        }

        .projects-button {
            background: black;
            color: white;
        }

        .resume-button {
            background: white;
            color: black;
        }

        /* SOCIAL */

        .social {
            display: flex;
            gap: 25px;
        }

        .social a {
            color: black;
            text-decoration: none;
        }

        /* MOBILE */

        @media (max-width: 900px) {

            header {
                padding: 20px 30px;
            }

            nav {
                gap: 15px;
            }

            .home {
                padding: 60px 7%;
                gap: 50px;
            }

            .photo {
                width: 280px;
                height: 350px;
            }

            .content h1 {
                font-size: 45px;
            }
        }

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 20px;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .home {
                flex-direction: column;
                align-items: flex-start;
            }

            .photo {
                width: 100%;
                max-width: 350px;
            }
        }
    </style>
</head>

<body>

    <header>

        <div class="logo">
            TG
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Skills</a>
            <a href="#">Projects</a>
            <a href="#">Education</a>
            <a href="#">Experience</a>
            <a href="#">Contact</a>
        </nav>

    </header>


    <main>

        <section class="home">

            <div class="photo">
                <p>YOUR PHOTO</p>
            </div>


            <div class="content">

                <p class="hello">
                    Hello, I'm
                </p>

                <h1>
                    TEJASREE GADDAM
                </h1>

                <h2>
                    Python Developer
                </h2>

                <p class="description">
                    I build scalable, reliable applications
                    using Python, modern backend technologies,
                    cloud platforms, and AI.
                </p>


                <div class="buttons">

                    <a href="#" class="projects-button">
                        View My Projects
                    </a>

                    <a href="#" class="resume-button">
                        Download Resume
                    </a>

                </div>


                <div class="social">

                    <a href="https://github.com/teja2411">
                        GitHub
                    </a>

                    <a href="https://www.linkedin.com/in/tejasree-g-8381b1226">
                        LinkedIn
                    </a>

                    <a href="mailto:tsreeusa2411@gmail.com">
                        Email
                    </a>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
